<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="R4.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معادله درجه یک</title>
</head>
<style>
    #container {
        height: auto;
        width: 100%;
    }
    
    #h {
        position: absolute;
        right: 100px;
        top: 50px;
    }
    
    @font-face {
        font-family: radmehr;
        src: url("Parastoo.eot");
        src: url("Parastoo.ttf");
        src: url("Parastoo.woff");
        src: url("Parastoo.woff2");
    }
    
    .x {
        font-size: 28px;
        font-family: radmehr;
    }
    
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    
    input {
        border-radius: 7px;
        width: 50px;
        height: 50px;
        font-size: 28px;
        text-align: center;
        font-family: radmehr;
        background-color: red;
    }
    
    #o {
        font-family: radmehr;
        position: absolute;
        top: 15px;
        left: 530px;
    }
    
    #a {
        margin-top: 10px;
    }
    
    #s {
        font-size: 28px;
        text-align: center;
        font-family: radmehr;
        padding: 8px;
        border-radius: 7px;
        background-color: springgreen;
    }
    
    #t {
        transition: all 2s;
        font-family: radmehr;
        font-size: 20px;
    }
    
    #footer {
        margin-top: 100px;
    }
</style>

<body>
    <center>
        <div id="container">
            <div id="header">
                <img src="h.jpg" width="100%" height="200px">
            </div>
            <a href="mathdata.html"><img src="R4.png" width="55px" height="55px" id="h"></a>
            <h1 id="o">حل معادلات درجه یک</h1>
            <div id="a">
                <label><input id="l" type="number"></label>
                <label class="x">&nbsp; X    + &nbsp;</label>
                <label class="x"><input id="m" type="number">&nbsp; = &nbsp;</label>
                <label><input id="n" type="number"></label><br><br><br><br>
                <button onclick="calc()" id="s">محاسبه</button>
                <h1 id="t"></h1>
            </div>
            <div id="footer">
                <img src="f.jpg" width="100%">
            </div>
        </div>
    </center>
</body>
<script>
    function calc() {
        var a = document.getElementById("l").value;
        var b = document.getElementById("m").value;
        var c = document.getElementById("n").value;
        if (a == "" || b == "" || c == "") {
            document.getElementById("t").innerHTML = "لطفا عدد وارد نمایید";
        } else if (a == 0) {
            document.getElementById("t").innerHTML = "معادله جواب ندارد";
        }
        /*else if(a==0 && b==c){
            document.getElementById("t").innerHTML="معادله بی نهایت جواب دارد";
        }*/
        else {
            var m = c - b;
            var d = m / a;
            document.getElementById("t").innerHTML = d;
        }
    }
</script>

</html>
