<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="R4.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دو معادله دو مجهول</title>
</head>
<style>
    #container {
        height: auto;
        width: 100%;
    }
    
    #h {
        position: absolute;
        right: 100px;
        top: 50px;
    }
    
    @font-face {
        font-family: radmehr;
        src: url("Parastoo.eot");
        src: url("Parastoo.ttf");
        src: url("Parastoo.woff");
        src: url("Parastoo.woff2");
    }
    
    .x {
        font-size: 28px;
        font-family: radmehr;
    }
    
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    
    input {
        border-radius: 7px;
        width: 50px;
        height: 50px;
        font-size: 28px;
        text-align: center;
        font-family: radmehr;
        background-color: red;
    }
    
    #o {
        font-family: radmehr;
        position: absolute;
        top: 15px;
        left: 530px;
    }
    
    #a {
        margin-top: 10px;
    }
    
    #s {
        font-size: 28px;
        text-align: center;
        font-family: radmehr;
        padding: 8px;
        border-radius: 7px;
        background-color: springgreen;
    }
    
    #t,
    #u {
        transition: all 2s;
        font-family: radmehr;
        font-size: 25px;
    }
    
    h1 {
        direction: rtl;
    }
    
    #footer {
        margin-top: 100px;
    }
</style>

<body>
    <center>
        <div id="container">
            <div id="header">
                <img src="h.jpg" width="100%" height="200px">
            </div>
            <a href="mathdata.html"><img src="R4.png" width="55px" height="55px" id="h"></a>
            <h1 id="o">حل معادلات دو معادله دو مجهول</h1>
            <div id="a">
                <label><input id="l" type="number"></label>
                <label class="x">&nbsp; x <button id="l2">+</button></label>
                <button id="l3">-</button>
                <label class="x"><input id="m" type="number">&nbsp; y &nbsp; = &nbsp;</label>
                <label><input id="n" type="number"></label><br><br><br><br>
                <label><input id="p" type="number"></label>
                <label class="x">&nbsp; x &nbsp; + &nbsp;</label>
                <label class="x"><input id="q" type="number">&nbsp; y &nbsp; = &nbsp;</label>
                <label><input id="r" type="number"></label><br><br><br><br>
                <button onclick="calc()" id="s">محاسبه</button>
                <h1 id="t"></h1>
                <h1 id="u"></h1>
            </div>
            <div id="footer">
                <img src="f.jpg" width="100%">
            </div>
        </div>
    </center>
</body>
<script>
    function calc() {
        var a1 = document.getElementById("l").value;
        var b1 = document.getElementById("m").value;
        var c1 = document.getElementById("n").value;
        var a2 = document.getElementById("p").value;
        var b2 = document.getElementById("q").value;
        var c2 = document.getElementById("r").value;
        var d = a1 * b2 - a2 * b1;
        var x = (b2 * c1 - b1 * c2) / d;
        var y = (a1 * c2 - a2 * c1) / d;
        /*let x = (c - (b * (f - (d * c / a) / e))) / (a - (b * d / e));
        let y = (c - (a * x)) / b == (f - (d * x)) / e;*/
        if (a1 == "" || b1 == "" || c1 == "" || a2 == "" || b2 == "" || c2 == "") {
            document.getElementById("t").innerHTML = "لطفا عدد وارد نمایید";
        } else if (x == "Infinity" || x == "-Infinity" || y == "Infinity" || y == "-Infinity") {
            document.getElementById("u").innerHTML = "y = " + "بی شمار جواب دارد.";
            document.getElementById("t").innerHTML = "x = " + "بی شمار جواب دارد.";
        } else {
            document.getElementById("u").innerHTML = "y = " + y;
            document.getElementById("t").innerHTML = "x = " + x;
        }
    }
</script>

</html>
