<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="R4.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماشین حساب</title>
</head>
<style>
    @font-face {
        font-family: radmehr;
        src: url("Parastoo.eot");
        src: url("Parastoo.ttf");
        src: url("Parastoo.woff");
        src: url("Parastoo.woff2");
    }
    
    #h {
        position: absolute;
        right: 100px;
        top: 50px;
    }
    
    #o {
        font-family: radmehr;
        position: absolute;
        top: 15px;
        left: 600px;
    }
    
    #z {
        text-align: center;
        height: 80px;
        width: 300px;
        padding: 5px;
        border-radius: 7px;
        font-size: 30px;
        font-family: radmehr;
        position: relative;
        left: 55px;
        top: 100px;
    }
    
    table {
        width: 400px;
        height: 400px;
        border: none;
    }
    
    td {
        width: 100px;
        height: 100px;
        background-color: blue;
    }
    
    input {
        width: 100px;
        height: 100px;
        background-color: crimson;
        font-size: 27px;
        font-family: radmehr;
    }
    
    td:hover {
        background-color: red;
        transition: all;
    }
    
    #a:hover {
        background-color: blue;
    }
    
    #footer {
        margin-top: 100px;
    }
</style>

<body>
    <center>
        <div id="header">
            <img src="h.jpg" width="100%" height="200px">
        </div>
        <a href="mathdata.html"><img src="R4.png" width="55px" height="55px" id="h"></a>
        <h1 id="o">ماشین حساب</h1>
        <form name="calculator">
            <table border="3px">
                <tr>
                    <td><input type="button" id="a" value="AC" onclick="calculator.analyze.value=''"></td>
                    <input type="text" name="analyze" id="z">
                </tr>
                <tr>
                    <td><input type="button" id="a" value="7" onclick="calculator.analyze.value+=7"></td>
                    <td><input type="button" id="a" value="8" onclick="calculator.analyze.value+=8"></td>
                    <td><input type="button" id="a" value="9" onclick="calculator.analyze.value+=9"></td>
                    <td><input type="button" id="a" value="÷" onclick="calculator.analyze.value+='/'"></td>
                </tr>

                <tr>
                    <td><input type="button" id="a" value="4" onclick="calculator.analyze.value+=4"></td>
                    <td><input type="button" id="a" value="5" onclick="calculator.analyze.value+=5"></td>
                    <td><input type="button" id="a" value="6" onclick="calculator.analyze.value+=6"></td>
                    <td><input type="button" id="a" value="×" onclick="calculator.analyze.value+='*'"></td>
                </tr>

                <tr>
                    <td><input type="button" id="a" value="1" onclick="calculator.analyze.value+=1"></td>
                    <td><input type="button" id="a" value="2" onclick="calculator.analyze.value+=2"></td>
                    <td><input type="button" id="a" value="3" onclick="calculator.analyze.value+=3"></td>
                    <td><input type="button" id="a" value="-" onclick="calculator.analyze.value+='-'"></td>
                </tr>

                <tr>
                    <td><input type="button" id="a" value="0" onclick="calculator.analyze.value+='0'"></td>
                    <td><input type="button" id="a" value="/" onclick="calculator.analyze.value+='.'"></td>
                    <td><input type="button" id="a" value="=" onclick="calculator.analyze.value=eval(calculator.analyze.value)"></td>
                    <td><input type="button" id="a" value="+" onclick="calculator.analyze.value+='+'"></td>
                </tr>
            </table>
            <div id="footer">
                <img src="f.jpg" width="100%">
            </div>
        </form>
    </center>
</body>

<script>
</script>

</html>
